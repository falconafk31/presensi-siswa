<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#047857" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistem Presensi & Perpustakaan Madrasah — presensi harian, rekap akademik, dan sirkulasi perpustakaan dalam satu portal." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23047857'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3E%F0%9F%8F%AB%3C/text%3E%3C/svg%3E" />
    <!-- Font Inter di-self-host (bundle @fontsource-variable/inter), tanpa CDN
         eksternal → tanpa DNS/round-trip Google Fonts, tidak render-blocking. -->
    <title>Sistem Presensi &amp; Perpustakaan</title>
    <style>
      /* ============================================================
         BOOT SPLASH — App Shell instan (murni HTML/CSS, tanpa JS).
         Mencegah layar putih / kedip saat bundle & sesi dimuat.
         Netral (tanpa nama/logo sekolah bawaan); logo madrasah dari
         menu Pengaturan > Identitas Madrasah di-inject dari cache
         localStorage oleh script inline di bawah (kunjungan berikutnya).
         ============================================================ */
      html, body {
        margin: 0;
        background: #f8fafc;
      }
      .boot-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: 'Inter Variable', 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
        animation: boot-fade-in 0.25s ease-out;
      }
      .boot-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 20px -6px rgb(15 23 42 / 0.15);
      }
      .boot-logo[hidden] { display: none; }
      .boot-title {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: #0f172a;
      }
      .boot-sub {
        margin: 0;
        font-size: 12px;
        color: #94a3b8;
      }
      .boot-spinner {
        width: 22px;
        height: 22px;
        margin-top: 2px;
        border: 2.5px solid #e2e8f0;
        border-top-color: #047857;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-fade-in { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash, .boot-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Splash digambar langsung oleh browser, lalu otomatis diganti
           isi #app saat Vue mount (setelah rute pertama benar-benar siap). -->
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-logo" id="boot-logo" hidden></div>
        <p class="boot-title">Sistem Presensi &amp; Perpustakaan</p>
        <p class="boot-sub">Memuat aplikasi&hellip;</p>
        <div class="boot-spinner"></div>
      </div>
      <script>
        /* Ambil logo madrasah dari cache (disimpan oleh stores/settings.js
           setelah fetch Pengaturan > Identitas Madrasah > Unggah Logo).
           Kunjungan pertama: splash tampil netral tanpa logo. */
        try {
          var logo = localStorage.getItem('app.logo_url')
          var el = document.getElementById('boot-logo')
          if (logo && el) {
            el.hidden = false
            var img = document.createElement('img')
            img.src = logo
            img.alt = ''
            img.style.cssText = 'width:100%;height:100%;object-fit:contain;background:#fff;padding:2px;box-sizing:border-box'
            el.appendChild(img)
          }
        } catch (e) { /* abaikan */ }
      </script>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
